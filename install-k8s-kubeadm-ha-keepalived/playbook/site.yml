---
- name: Подготовка всех узлов для Kubernetes
  hosts: all
  become: true
  tags: install

  pre_tasks:
    - name: Установка необходимых пакетов
      ansible.builtin.apt:
        name:
          - curl
          - wget
          - vim
          - nano
          - net-tools
          - git
          - containerd
          - apt-transport-https
          - ca-certificates
          - gnupg
          - lsb-release
          - keepalived
        state: latest
        update_cache: true
      tags: prepare

    - name: Отключение swap (временно)
      ansible.builtin.command: swapoff -a
      when: ansible_facts.swaptotal_mb > 0
      tags: [prepare, swap]

    - name: Отключение swap (навсегда)
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(?!\s*#)(.*swap.*)$'
        replace: '# \1'
      tags: [prepare, swap]

    - name: Загрузка модулей ядра
      ansible.builtin.modprobe:
        name: "{{ item }}"
        state: present
      loop:
        - overlay
        - br_netfilter
      tags: prepare

    - name: Настройка sysctl для Kubernetes
      ansible.builtin.sysctl:
        name: "{{ item.name }}"
        value: "{{ item.value }}"
        state: present
        reload: true
      loop:
        - { name: net.bridge.bridge-nf-call-iptables, value: 1 }
        - { name: net.bridge.bridge-nf-call-ip6tables, value: 1 }
        - { name: net.ipv4.ip_forward, value: 1 }
      tags: prepare

    - name: Настройка containerd
      tags: containerd
      block:
      - name: Создание директории для containerd
        ansible.builtin.file:
          path: /etc/containerd
          state: directory
          owner: root
          group: root
          mode: '0755'

      - name: Создание конфигурации containerd
        ansible.builtin.shell:
          cmd: containerd config default > /etc/containerd/config.toml
          creates: /etc/containerd/config.toml

      - name: Включение SystemdCgroup
        ansible.builtin.replace:
          path: /etc/containerd/config.toml
          regexp: '^(\s*)SystemdCgroup\s*=\s*false'
          replace: '\1SystemdCgroup = true'

      - name: Перезапуск containerd
        ansible.builtin.service:
          name: containerd
          state: restarted
          enabled: true

  tasks:
    - name: Установка и настройка Kubernetes
      block:
      - name: Добавление ключа репозитория Kubernetes в trusted.gpg.d
        ansible.builtin.shell:
          cmd: |
            curl -fsSL https://pkgs.k8s.io/core:/stable:/v1.33/deb/Release.key | gpg --dearmor -o /etc/apt/trusted.gpg.d/kubernetes.gpg
          creates: /etc/apt/trusted.gpg.d/kubernetes.gpg

      - name: Добавление репозитория Kubernetes (без signed-by)
        ansible.builtin.copy:
          dest: /etc/apt/sources.list.d/kubernetes.list
          content: |
            deb https://pkgs.k8s.io/core:/stable:/v1.33/deb/ /
          mode: '0644'

      - name: Обновление кеша apt
        ansible.builtin.apt:
          update_cache: true

      - name: Установка kubelet, kubeadm, kubectl
        ansible.builtin.apt:
          name:
            - kubelet
            - kubeadm
            - kubectl
          state: latest

      - name: Включение и запуск kubelet
        ansible.builtin.service:
          name: kubelet
          enabled: yes
          state: started
      tags: k8s

  post_tasks:
    - name: Добавить автодополнение kubectl в .bashrc для root
      ansible.builtin.lineinfile:
        path: /root/.bashrc
        line: 'source <(kubectl completion bash)'
        insertafter: EOF
      tags: [bashrc]

    - name: Добавить автодополнение kubectl в .bashrc для vagrant
      ansible.builtin.lineinfile:
        path: /home/vagrant/.bashrc
        line: 'source <(kubectl completion bash)'
        insertafter: EOF
      tags: [bashrc]

#################################################################

- name: Настройка keepalived на master-node
  hosts: master
  become: true
  tags: keepalived
  vars:
    vip: "192.168.56.30"
    interface: "enp0s8"
    master_priority: 150
    backup_priority: 100

  tasks:
    - name: Создание конфигурации keepalived
      ansible.builtin.copy:
        dest: /etc/keepalived/keepalived.conf
        content: |
          ! Configuration File for keepalived
          vrrp_instance VI_1 {
              interface {{ interface }}
              state {{ 'MASTER' if inventory_hostname == groups['master'][0] else 'BACKUP' }}
              virtual_router_id 51
              priority {{ master_priority if inventory_hostname == groups['master'][0] else backup_priority }}
              advert_int 1
              authentication {
                  auth_type PASS
                  auth_pass kubernetes
              }
              virtual_ipaddress {
                  {{ vip }}/24
              }
          }
        mode: '0644'

    - name: Запуск и включение keepalived
      ansible.builtin.service:
        name: keepalived
        enabled: yes
        state: started

#################################################################

- name: Инициализация первого master-node
  hosts: master-node-1
  become: true
  tags: master-node-1
  vars:
    apiserver_advertise_address: "192.168.56.10"
    pod_network_cidr: "10.244.0.0/16"
    control_plane_endpoint: "192.168.56.30:6443"
  tasks:
    - name: Создание конфигурационного файла для kubeadm
      ansible.builtin.copy:
        dest: /tmp/kubeadm-config.yaml
        content: |
          apiVersion: kubeadm.k8s.io/v1beta3
          kind: InitConfiguration
          localAPIEndpoint:
            advertiseAddress: "{{ apiserver_advertise_address }}"
            bindPort: 6443
          ---
          apiVersion: kubeadm.k8s.io/v1beta3
          kind: ClusterConfiguration
          apiServer:
            certSANs:
            - "192.168.56.10"
            - "192.168.56.11"
            - "192.168.56.12"
            - "192.168.56.30"
            - "10.0.2.15"
            - "master-node-1"
            - "master-node-2"
            - "master-node-3"
          etcd:
            local:
              certSANs:
              - "192.168.56.10"
              - "192.168.56.11"
              - "192.168.56.12"
              - "192.168.56.30"
              - "10.0.2.15"
              - "master-node-1"
              - "master-node-2"
              - "master-node-3"
              extraArgs:
                advertise-client-urls: "https://{{ apiserver_advertise_address }}:2379"
                initial-advertise-peer-urls: "https://{{ apiserver_advertise_address }}:2380"
                listen-client-urls: "https://0.0.0.0:2379"
                listen-peer-urls: "https://0.0.0.0:2380"
          kubernetesVersion: "v1.33.13"
          controlPlaneEndpoint: "{{ control_plane_endpoint }}"
          networking:
            podSubnet: "{{ pod_network_cidr }}"

    - name: Инициализация кластера с загрузкой сертификатов
      ansible.builtin.command:
        cmd: kubeadm init --config /tmp/kubeadm-config.yaml --upload-certs
        creates: /etc/kubernetes/admin.conf
      register: init_output

    - name: Создание .kube/config для пользователя root
      ansible.builtin.shell:
        cmd: |
          mkdir -p $HOME/.kube
          cp /etc/kubernetes/admin.conf $HOME/.kube/config
          chown $(id -u):$(id -g) $HOME/.kube/config
      when: init_output.changed

#################################################################

- name: Установка сетевого плагина Flannel для первого master-node
  hosts: master-node-1
  become: true
  tags: network
  tasks:
    - name: Применить манифест Flannel
      ansible.builtin.shell:
        cmd: kubectl apply -f https://raw.githubusercontent.com/flannel-io/flannel/master/Documentation/kube-flannel.yml
      environment:
        KUBECONFIG: /etc/kubernetes/admin.conf
      register: flannel_result
      changed_when: '"created" in flannel_result.stdout or "configured" in flannel_result.stdout'

#################################################################

- name: Получение certificate-key для control-plane
  hosts: master-node-1
  become: true
  tags: join-master
  tasks:
    - name: Генерация нового certificate-key
      ansible.builtin.shell:
        cmd: openssl rand -hex 32
      register: new_cert_key
      changed_when: false

    - name: Загрузка certificate-key в секрет upload-certs
      ansible.builtin.shell:
        cmd: kubeadm init phase upload-certs --upload-certs --certificate-key {{ new_cert_key.stdout }}
      register: upload_result
      changed_when: false

    - name: Сохранение certificate-key как факта
      ansible.builtin.set_fact:
        certificate_key: "{{ new_cert_key.stdout }}"

    - name: Проверка, что ключ получен
      ansible.builtin.fail:
        msg: "Certificate key is empty."
      when: certificate_key == ""

#################################################################

- name: Получить join-команду с первого master-node для всех узлов
  hosts: master-node-1
  become: true
  tags: [join-worker, join-master]
  tasks:
    - name: Сгенерировать токен для подключения worker-node
      ansible.builtin.shell: kubeadm token create --print-join-command
      register: join_command_raw
      changed_when: false

    - name: Сохранить полную команду как факт
      ansible.builtin.set_fact:
        join_command: "{{ join_command_raw.stdout | trim }}"

    - name: Извлечь токен, хэш и endpoint из команды
      ansible.builtin.set_fact:
        join_token: "{{ join_command.split()[4] }}"
        discovery_hash: "{{ join_command.split()[6] }}"
        api_server_endpoint: "{{ join_command.split()[2] }}"

#################################################################

- name: Присоединение master-узлов как control-plane
  hosts: master
  become: true
  serial: 1
  tags: join-master
  tasks:
    - name: Создание конфигурационного файла для присоединения мастера
      ansible.builtin.copy:
        dest: /tmp/kubeadm-join-config.yaml
        content: |
          apiVersion: kubeadm.k8s.io/v1beta3
          kind: JoinConfiguration
          discovery:
            bootstrapToken:
              token: "{{ hostvars['master-node-1'].join_token }}"
              apiServerEndpoint: "{{ hostvars['master-node-1'].api_server_endpoint }}"
              caCertHashes:
              - "{{ hostvars['master-node-1'].discovery_hash }}"
          controlPlane:
            localAPIEndpoint:
              advertiseAddress: "{{ ansible_host }}"
              bindPort: 6443
            certificateKey: "{{ hostvars['master-node-1'].certificate_key }}"
      when: inventory_hostname != groups['master'][0]

    - name: Выполнить присоединение к кластеру
      ansible.builtin.shell:
        cmd: kubeadm join --config /tmp/kubeadm-join-config.yaml
        creates: /etc/kubernetes/kubelet.conf
      when: inventory_hostname != groups['master'][0]
      register: join_result

#################################################################

- name: Присоединение worker-node к кластеру
  hosts: worker-node*
  become: true
  tags: join-worker
  tasks:
    - name: Выполнить присоединение
      ansible.builtin.shell:
        cmd: "{{ hostvars['master-node-1'].join_command }}"
        creates: /etc/kubernetes/kubelet.conf

...
