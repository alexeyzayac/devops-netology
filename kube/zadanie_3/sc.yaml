---

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: storage-minikube
provisioner: kubernetes.io/no-provisioner
volumeBindingMode: WaitForFirstConsumer

---

apiVersion: v1
kind: PersistentVolume
metadata:
  name: pv-minikube
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  storageClassName: storage-minikube
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /tmp/data

---

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pvc-minikube
spec:
  volumeName: pv-minikube
  storageClassName: storage-minikube
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: data-exchange-pvc
spec:
  replicas: 1
  selector:
    matchLabels:
      app: data-exchange-pvc
  template:
    metadata:
      labels:
        app: data-exchange-pvc
    spec:

      containers:
        - name: busybox
          image: busybox
          command: ['sh', '-c', 'while true; do echo "test" >> /tmp/data/success.txt; sleep 5; done']
          volumeMounts:
            - name: vol-shared
              mountPath: /tmp/data

        - name: multitool
          image: wbitt/network-multitool:latest
          volumeMounts:
            - name: vol-shared
              mountPath: /tmp/data


      volumes:
        - name: vol-shared
          persistentVolumeClaim:
            claimName: pvc-minikube

...
